<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="dashboard.css" />
  </head>
  <body>
    <h1>Dashboard joueurs</h1>
    <form id="serverForm">
      <label>
        Adresse du serveur (IP:PORT) :
        <input
          type="text"
          id="serverAddress"
          placeholder="13.38.137.68:8000"
          required
        />
      </label>
      <br />
      <button type="submit">Charger les joueurs</button>
    </form>
    <p id="errorMessage" class="error"></p>
    <h2>Classement</h2>
    <div id="ranking"></div>

    <script src="dashboard.js"></script>
  </body>
</html>
